<!DOCTYPE html>
<html>

<head>

<title>🌌 The Universe Of Syeda Sheza 🌌</title>

<style>

body{
margin:0;
overflow:hidden;
height:100vh;
background:linear-gradient(
to bottom,
#020617,
#0f172a,
#1e293b
);
font-family:Arial,sans-serif;
color:white;
text-align:center;
}

.container{
position:relative;
z-index:10;
padding-top:60px;
}

h1{
font-size:50px;
text-shadow:
0 0 15px white,
0 0 30px #60a5fa,
0 0 50px #60a5fa;
}

.subtitle{
font-size:22px;
line-height:1.8;
margin-bottom:20px;
}

.photo{
width:260px;
height:260px;
object-fit:cover;
border-radius:50%;
border:5px solid white;
box-shadow:
0 0 25px white,
0 0 50px #60a5fa,
0 0 80px #60a5fa;
animation:float 4s infinite ease-in-out;
}

.moon{
position:absolute;
top:20px;
right:40px;
font-size:120px;
animation:float 5s infinite ease-in-out;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0);}
}

.star{
position:absolute;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
0%{opacity:0.3;}
50%{opacity:1;}
100%{opacity:0.3;}
}

.floating{
position:absolute;
font-size:30px;
animation:rise 12s linear infinite;
}

@keyframes rise{
from{
transform:translateY(120vh);
}
to{
transform:translateY(-120vh);
}
}

button{
padding:15px 30px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
margin-top:20px;
}

</style>

</head>

<body>

<div class="moon">
🌙
</div>

<div class="container">

<h1>
🌌 The Universe Of Syeda Sheza 🌌
</h1>

<div class="subtitle">

🩵✨🌙💫🦋🌹☁️🎀🪄💌🤲🏻🌷✨

<br><br>

Among billions of people...

<br>

Allah wrote your name into my story...

🩵

</div>

<img
src="IMG-20260529-WA0018.jpg"
class="photo">

<br>

<button onclick="location.href='beginning.html'">
💬 Continue The Story
</button>
</div>

<script>

for(let i=0;i<120;i++){

let star=document.createElement("div");

star.className="star";

star.innerHTML="⭐";

star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";

document.body.appendChild(star);

}

let emojis=[
"🩵",
"🌹",
"🦋",
"💫",
"✨",
"🌙"
];

for(let i=0;i<60;i++){

let e=document.createElement("div");

e.className="floating";

e.innerHTML=
emojis[
Math.floor(
Math.random()*emojis.length
)
];

e.style.left=
Math.random()*100+"vw";

e.style.animationDuration=
(8+Math.random()*10)+"s";

document.body.appendChild(e);

}

</script>

</body>

</html>
