<!DOCTYPE html>
<html>

<head>

<title>🌌 The Universe Of Syeda Sheza 🌌</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial,sans-serif;
background:
radial-gradient(
circle at center,
#0f172a,
#020617
);
color:white;
text-align:center;
}

h1{
position:absolute;
top:20px;
width:100%;
font-size:42px;
z-index:5;
text-shadow:
0 0 15px white,
0 0 30px #60a5fa;
}

.subtitle{
position:absolute;
top:90px;
width:100%;
font-size:20px;
z-index:5;
}

.center{

position:absolute;

top:50%;

left:50%;

transform:
translate(-50%,-50%);

z-index:10;

}

.center img{

width:220px;

height:220px;

border-radius:50%;

object-fit:cover;

border:6px solid white;

box-shadow:
0 0 30px white,
0 0 70px #60a5fa,
0 0 120px #93c5fd;

cursor:pointer;

transition:0.5s;

}

.center img:hover{

transform:scale(1.08);

}

.orbit{

position:absolute;

top:50%;

left:50%;

transform:
translate(-50%,-50%);

border:
1px solid rgba(255,255,255,0.15);

border-radius:50%;

}

.orbit1{
width:340px;
height:340px;
animation:spin 25s linear infinite;
}

.orbit2{
width:500px;
height:500px;
animation:spin 40s linear infinite;
}

.orbit3{
width:650px;
height:650px;
animation:spin 55s linear infinite;
}

.planet{

position:absolute;

top:-20px;

left:50%;

transform:
translateX(-50%);

font-size:38px;

}

.message{

display:none;

position:absolute;

top:78%;

left:50%;

transform:
translateX(-50%);

width:90%;

max-width:800px;

background:
rgba(255,255,255,0.08);

padding:20px;

border-radius:20px;

font-size:24px;

line-height:1.8;

z-index:10;

}

button{

position:absolute;

bottom:25px;

left:50%;

transform:
translateX(-50%);

padding:15px 30px;

border:none;

border-radius:30px;

font-size:18px;

cursor:pointer;

z-index:10;

}

.star{

position:absolute;

font-size:14px;

animation:twinkle 3s infinite;

}

.float{

position:absolute;

font-size:26px;

animation:floatUp linear infinite;

}

@keyframes spin{

from{
transform:
translate(-50%,-50%)
rotate(0deg);
}

to{
transform:
translate(-50%,-50%)
rotate(360deg);
}

}

@keyframes twinkle{

0%{opacity:0.2;}
50%{opacity:1;}
100%{opacity:0.2;}

}

@keyframes floatUp{

from{
transform:
translateY(110vh);
}

to{
transform:
translateY(-120vh);
}

}

</style>

</head>

<body>

<h1>
🌌 The Universe Of Syeda Sheza 🌌
</h1>

<div class="subtitle">

🩵 Every universe has a center...

✨ This one has yours.

</div>

<div class="orbit orbit1">
<div class="planet">🌙</div>
</div>

<div class="orbit orbit2">
<div class="planet">🪐</div>
</div>

<div class="orbit orbit3">
<div class="planet">⭐</div>
</div>

<div class="center">

<img
src="IMG-20260529-WA0018.jpg"
onclick="revealMessage()">

</div>

<div
class="message"
id="message">

💌

Welcome to

<b>The Universe Of Syeda Sheza</b>

🩵✨🌙

Where memories orbit endlessly...

Where smiles become stars...

And where even the smallest moments become part of a beautiful story.

🌹🦋💫

</div>

<button
onclick="location.href='beginning.html'">
✨ Begin The Journey

</button>

<script>

function revealMessage(){

document
.getElementById(
"message"
)
.style.display=
"block";

}

for(let i=0;i<300;i++){

let star=
document.createElement("div");

star.className="star";

star.innerHTML="⭐";

star.style.left=
Math.random()*100+"vw";

star.style.top=
Math.random()*100+"vh";

star.style.animationDuration=
(2+Math.random()*5)+"s";

document.body.appendChild(star);

}

const items=[
"🦋",
"🌹",
"✨",
"🩵",
"💫",
"🌙"
];

for(let i=0;i<100;i++){

let e=
document.createElement("div");

e.className="float";

e.innerHTML=
items[
Math.floor(
Math.random()*items.length
)
];

e.style.left=
Math.random()*100+"vw";

e.style.animationDuration=
(8+Math.random()*12)+"s";

e.style.animationDelay=
Math.random()*10+"s";

document.body.appendChild(e);

}

</script>

</body>

</html>
