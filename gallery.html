<!DOCTYPE html>
<html>

<head>

<title>📸 Our Memories 📸</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,sans-serif;

background:
linear-gradient(
to bottom,
#020617,
#0f172a,
#1e293b
);

color:white;

overflow-x:hidden;

text-align:center;

}

h1{

margin-top:30px;

font-size:55px;

text-shadow:
0 0 15px white,
0 0 30px #60a5fa;

}

.subtitle{

font-size:22px;

margin-top:10px;

margin-bottom:25px;

padding:0 20px;

}

.gallery{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:30px;

padding:30px;

max-width:1400px;

margin:auto;

}

.polaroid{

background:white;

padding:10px;

border-radius:10px;

box-shadow:
0 0 20px rgba(255,255,255,0.3);

transform:rotate(-2deg);

transition:0.4s;

cursor:pointer;

}

.polaroid:nth-child(even){

transform:rotate(2deg);

}

.polaroid:hover{

transform:scale(1.05);

box-shadow:
0 0 30px white,
0 0 60px #60a5fa;

}

.polaroid img{

width:100%;

height:280px;

object-fit:cover;

border-radius:6px;

}

.caption{

color:black;

font-size:18px;

padding:10px;

font-weight:bold;

}

.memoryBox{

background:
rgba(255,255,255,0.08);

width:90%;

max-width:800px;

margin:30px auto;

padding:25px;

border-radius:20px;

font-size:24px;

line-height:1.8;

min-height:120px;

}

button{

padding:15px 30px;

border:none;

border-radius:30px;

font-size:18px;

cursor:pointer;

margin:30px;

}

.star{

position:fixed;

font-size:15px;

animation:twinkle 3s infinite;

pointer-events:none;

}

.float{

position:fixed;

font-size:28px;

animation:rise linear infinite;

pointer-events:none;

}

@keyframes twinkle{

0%{opacity:0.2;}

50%{opacity:1;}

100%{opacity:0.2;}

}

@keyframes rise{

from{
transform:translateY(110vh);
}

to{
transform:translateY(-120vh);
}

}

</style>

</head>

<body>

<h1>
📸 Our Memories 📸
</h1>

<div class="subtitle">

🩵 Every photo tells a story...
<br>
✨ Tap any photo to reveal a memory.

</div>

<div class="memoryBox" id="memory">

💌 Tap a photo to reveal a memory...

</div>

<div class="gallery">
