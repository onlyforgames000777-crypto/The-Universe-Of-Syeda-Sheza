<!DOCTYPE html>
<html>
<head>
<title>💬 Where It All Began</title>

<style>

body{
margin:0;
background:#0b141a;
font-family:Arial,sans-serif;
color:white;
}

.header{
background:#202c33;
padding:15px;
font-size:25px;
text-align:center;
}

.chat{
padding:20px;
}

.msg{
max-width:70%;
padding:12px;
margin:15px;
border-radius:15px;
font-size:20px;
display:none;
}

.left{
background:#202c33;
}

.right{
background:#005c4b;
margin-left:auto;
}

.story{
display:none;
text-align:center;
font-size:24px;
padding:25px;
line-height:1.8;
}

button{
display:none;
margin:20px auto;
padding:15px 30px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="header">
💬 The Conversation That Changed Everything
</div>

<div class="chat">

<div id="m1" class="msg right">
😭 Maths is too easy...
</div>

<div id="m2" class="msg left">
😭 You're flexing...
</div>

<div id="m3" class="msg right">
😭 Am I really flexing?
</div>

</div>

<div id="story" class="story">

🩵✨🌙

Neither of us knew...

that a random conversation about maths

would become one of the most beautiful chapters of my life.

🩵✨🌙

</div>

<button id="btn"
onclick="location.href='timeline.html'">

⏳ Continue Our Journey

</button>

<script>

setTimeout(()=>m1.style.display="block",1000);
setTimeout(()=>m2.style.display="block",2500);
setTimeout(()=>m3.style.display="block",4000);

setTimeout(()=>{
story.style.display="block";
btn.style.display="block";
},6000);

</script>

</body>
</html>
