<!DOCTYPE html>
<html>

<head>

<title>🎈 Reasons 🎈</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(
to bottom,
#020617,
#0f172a,
#1e293b
);
color:white;
overflow:hidden;
text-align:center;
}

h1{
margin-top:20px;
font-size:50px;
}

.subtitle{
font-size:22px;
margin-bottom:20px;
}

.balloonArea{
position:relative;
height:65vh;
}

.balloon{

position:absolute;

font-size:70px;

cursor:pointer;

transition:0.4s;

}

.balloon:hover{

transform:scale(1.15);

}

.reasonBox{

background:rgba(255,255,255,0.1);

width:85%;

max-width:700px;

margin:auto;

padding:20px;

border-radius:20px;

font-size:24px;

min-height:70px;

}

button{

padding:15px 30px;

border:none;

border-radius:30px;

font-size:18px;

cursor:pointer;

margin-top:20px;

}

</style>

</head>

<body>

<h1>
🎈 Reasons I Appreciate You 🎈
</h1>

<div class="subtitle">
💥 Tap balloons to discover reasons 🩵
</div>

<div class="balloonArea">

<div class="balloon" style="left:10%;top:15%;" onclick="pop(this,1)">🎈</div>
<div class="balloon" style="left:25%;top:35%;" onclick="pop(this,2)">🎈</div>
<div class="balloon" style="left:40%;top:10%;" onclick="pop(this,3)">🎈</div>
<div class="balloon" style="left:55%;top:40%;" onclick="pop(this,4)">🎈</div>
<div class="balloon" style="left:70%;top:20%;" onclick="pop(this,5)">🎈</div>
<div class="balloon" style="left:85%;top:45%;" onclick="pop(this,6)">🎈</div>

<div class="balloon" style="left:15%;top:60%;" onclick="pop(this,7)">🎈</div>
<div class="balloon" style="left:30%;top:75%;" onclick="pop(this,8)">🎈</div>
<div class="balloon" style="left:50%;top:65%;" onclick="pop(this,9)">🎈</div>
<div class="balloon" style="left:65%;top:80%;" onclick="pop(this,10)">🎈</div>
<div class="balloon" style="left:80%;top:65%;" onclick="pop(this,11)">🎈</div>
<div class="balloon" style="left:90%;top:80%;" onclick="pop(this,12)">🎈</div>

</div>

<div id="reason" class="reasonBox">

🩵 Pop a balloon...

</div>

<button onclick="location.href='apology.html'">

💌 Secret Letter →

</button>

<script>

const reasons = [

"🩵 You value my words.",

"🌷 You made ordinary days special.",

"✨ You stayed.",

"💫 You care.",

"🌙 You listen.",

"🦋 You make me smile.",

"🌹 You are kind.",

"🎀 You are memorable.",

"🤲🏻 You respect my feelings.",

"💌 You became part of my story.",

"⭐ You make conversations beautiful.",

"🩵 You are Syeda Sheza."

];

function pop(balloon,index){

balloon.innerHTML="💥";

balloon.style.pointerEvents="none";

document.getElementById("reason").innerHTML=

reasons[index-1];

}

</script>

</body>

</html>
