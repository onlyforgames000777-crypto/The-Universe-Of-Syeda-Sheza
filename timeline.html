<!DOCTYPE html>
<html>

<head>

<title>⏳ Our Journey ⏳</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(
to bottom,
#020617,
#0f172a,
#1e293b
);
color:white;
text-align:center;
overflow:hidden;
}

h1{
margin-top:30px;
font-size:55px;
text-shadow:
0 0 15px white,
0 0 30px #60a5fa;
}

.timeline{
padding:20px;
position:relative;
z-index:10;
}

.event{

background:rgba(255,255,255,0.08);

padding:25px;

margin:25px auto;

width:85%;

max-width:650px;

border-radius:25px;

font-size:28px;

backdrop-filter:blur(10px);

}

.arrow{
font-size:40px;
margin:10px;
}

button{

padding:15px 30px;

border:none;

border-radius:30px;

font-size:18px;

cursor:pointer;

margin-top:20px;

}

.star{
position:absolute;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
0%{opacity:0.2;}
50%{opacity:1;}
100%{opacity:0.2;}
}

</style>

</head>

<body>

<h1>
⏳ Our Journey ⏳
</h1>

<div class="timeline">

<div class="event">

💬

<br><br>

26 November 2025

<br><br>

✨ The Beginning

</div>

<div class="arrow">
⬇
</div>

<div class="event">

❤️

<br><br>

20 January 2026

<br><br>

🌹 Relationship Started

</div>

<div class="arrow">
⬇
</div>

<div class="event">

🤝

<br><br>

21 March 2026

<br><br>

🩵 First Handshake

</div>

<div class="arrow">
⬇
</div>

<div class="event">

🌙

<br><br>

Today

<br><br>

✨ Still Making Memories

</div>

<button onclick="location.href='gallery.html'">

🤝 Continue

</button>

</div>

<script>

for(let i=0;i<180;i++){

let star=document.createElement("div");

star.className="star";

star.innerHTML="⭐";

star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";

document.body.appendChild(star);

}

</script>

</body>

</html>
