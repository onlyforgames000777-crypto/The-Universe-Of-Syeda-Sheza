<!DOCTYPE html>
<html>

<head>

<title>⏳ Our Timeline ⏳</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(
to bottom,
#020617,
#0f172a,
#1e293b
);
color:white;
text-align:center;
overflow:hidden;
}

h1{
margin-top:40px;
font-size:50px;
}

.card{

background:rgba(255,255,255,0.08);

width:85%;

max-width:600px;

margin:25px auto;

padding:25px;

border-radius:25px;

backdrop-filter:blur(10px);

}

.date{
font-size:28px;
margin-top:10px;
}

.counter{
font-size:22px;
margin-top:15px;
color:#93c5fd;
}

button{

padding:15px 30px;

border:none;

border-radius:30px;

font-size:18px;

cursor:pointer;

margin-top:25px;

}

.star{
position:absolute;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
0%{opacity:0.2;}
50%{opacity:1;}
100%{opacity:0.2;}
}

</style>

</head>

<body>

<h1>
⏳ Our Journey ⏳
</h1>

<div class="card">

<h2>💬 First Conversation</h2>

<div class="date">
26 November 2025
</div>

<div id="counter1" class="counter">
Loading...
</div>

</div>

<div class="card">

<h2>🩵 Relationship Started</h2>

<div class="date">
20 January 2026
</div>

<div id="counter2" class="counter">
Loading...
</div>

</div>

<button onclick="location.href='handshake.html'">

🤝 Continue

</button>

<script>

for(let i=0;i<120;i++){

let star=document.createElement("div");

star.className="star";

star.innerHTML="⭐";

star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";

document.body.appendChild(star);

}

function updateCounters(){

let now=new Date();

let first=new Date("2025-11-26");

let relation=new Date("2026-01-20");

let diff1=Math.floor((now-first)/(1000*60*60*24));

let diff2=Math.floor((now-relation)/(1000*60*60*24));

document.getElementById("counter1").innerHTML=
"🩵 " + diff1 + " days together";

document.getElementById("counter2").innerHTML=
"❤️ " + diff2 + " days since relationship";
}

updateCounters();

setInterval(updateCounters,1000);

</script>

</body>

</html>
