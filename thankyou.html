<!DOCTYPE html>
<html>

<head>

<title>🌷 Thank You 🌷</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(
to bottom,
#020617,
#0f172a,
#1e293b
);
color:white;
text-align:center;
overflow:hidden;
}

.container{
max-width:900px;
margin:auto;
padding:40px;
position:relative;
z-index:10;
}

h1{
font-size:55px;
text-shadow:
0 0 15px white,
0 0 30px #60a5fa;
}

.card{

background:rgba(255,255,255,0.08);

padding:20px;

margin:20px;

border-radius:20px;

font-size:24px;

}

button{

padding:15px 30px;

border:none;

border-radius:30px;

font-size:18px;

cursor:pointer;

margin-top:20px;

}

.star{
position:absolute;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
0%{opacity:0.2;}
50%{opacity:1;}
100%{opacity:0.2;}
}

</style>

</head>

<body>

<div class="container">

<h1>
🌷 Thank You 🌷
</h1>

<div class="card">
🩵 Thank you for valuing my words so much...
</div>

<div class="card">
🌙 Thank you for every beautiful memory...
</div>

<div class="card">
✨ Thank you for every effort...
</div>

<div class="card">
💫 Thank you for staying...
</div>

<div class="card">
🌹 Thank you for being Syeda Sheza...
</div>

<div class="card">
🤲🏻 Thank you for being part of my story...
</div>

<button onclick="location.href='apology.html'">

🫀 One More Thing...

</button>

</div>

<script>

for(let i=0;i<150;i++){

let star=document.createElement("div");

star.className="star";

star.innerHTML="⭐";

star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";

document.body.appendChild(star);

}

</script>

</body>

</html>
