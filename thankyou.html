<!DOCTYPE html>
<html>
<head>
<title>🎁 Gifts For You 🎁</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(
to bottom,
#020617,
#0f172a,
#1e293b
);
color:white;
text-align:center;
overflow:hidden;
}

h1{
margin-top:30px;
font-size:50px;
}

.subtitle{
font-size:22px;
margin-bottom:30px;
}

.gifts{

display:flex;

flex-wrap:wrap;

justify-content:center;

gap:25px;

padding:20px;

}

.gift{

font-size:90px;

cursor:pointer;

transition:0.4s;

}

.gift:hover{

transform:scale(1.1);

}

.message{

display:none;

background:rgba(255,255,255,0.1);

padding:20px;

margin:15px auto;

width:80%;

max-width:600px;

border-radius:20px;

font-size:22px;

}

button{

padding:15px 30px;

border:none;

border-radius:30px;

font-size:18px;

cursor:pointer;

margin-top:25px;

}

.star{
position:absolute;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
0%{opacity:0.2;}
50%{opacity:1;}
100%{opacity:0.2;}
}

</style>
</head>

<body>

<h1>🎁 Gifts For Syeda Sheza 🎁</h1>

<div class="subtitle">
🩵 Tap the gifts to open them ✨
</div>

<div class="gifts">

<div class="gift" onclick="openGift(1)">
🎁
</div>

<div class="gift" onclick="openGift(2)">
🎁
</div>

<div class="gift" onclick="openGift(3)">
🎁
</div>

<div class="gift" onclick="openGift(4)">
🎁
</div>

<div class="gift" onclick="openGift(5)">
🎁
</div>

</div>

<div id="m1" class="message">
🩵 Thank you for valuing my words so much...
</div>

<div id="m2" class="message">
🌙 Thank you for every beautiful memory...
</div>

<div id="m3" class="message">
✨ Thank you for every effort...
</div>

<div id="m4" class="message">
💫 Thank you for staying...
</div>

<div id="m5" class="message">
🌹 Thank you for being Syeda Sheza...
</div>

<button onclick="location.href='reasons.html'">

🎈 100 Reasons →

</button>

<script>

for(let i=0;i<150;i++){

let star=document.createElement("div");

star.className="star";

star.innerHTML="⭐";

star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";

document.body.appendChild(star);

}

function openGift(num){

document.getElementById(
"m"+num
).style.display="block";

}

</script>

</body>
</html>
