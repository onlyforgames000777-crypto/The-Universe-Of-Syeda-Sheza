<!DOCTYPE html>
<html>

<head>

<title>🤝 The First Handshake 🤝</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(
to bottom,
#020617,
#0f172a,
#1e293b
);
color:white;
text-align:center;
overflow-x:hidden;
}

h1{
margin-top:30px;
font-size:50px;
text-shadow:
0 0 15px white,
0 0 30px #60a5fa;
}

.subtitle{
font-size:22px;
margin-bottom:25px;
}

.handshake{
font-size:140px;
cursor:pointer;
margin-top:30px;
transition:0.4s;
}

.handshake:hover{
transform:scale(1.1);
}

.card{
display:none;
width:90%;
max-width:850px;
margin:25px auto;
padding:25px;
border-radius:25px;
background:rgba(255,255,255,0.08);
font-size:24px;
line-height:1.8;
}

#continueBtn{
display:none;
padding:15px 30px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
margin:20px;
}

</style>

</head>

<body>

<h1>
🤝 The First Handshake 🤝
</h1>

<div class="subtitle">
✨ Tap the handshake 3 times
</div>

<div class="handshake" onclick="unlock()">
🤝
</div>

<div id="m1" class="card">

🌙 21 March 2026

<br><br>

To everyone else,
it was just a handshake.

<br><br>

To me,
it became a memory.

🩵

</div>

<div id="m2" class="card">

💌

Funny thing is...

our story started because of:

<b>"Maths is too easy."</b>

😭

</div>

<div id="m3" class="card">

✨

Some moments last seconds.

Some memories last forever.

🤝🩵🌙

</div>

<button
id="continueBtn"
onclick="location.href='thankyou.html'">

🎁 Continue To Gift Room

</button>

<script>

let stage = 0;

function unlock(){

stage++;

if(stage==1){

document.getElementById(
"m1"
).style.display="block";

}

if(stage==2){

document.getElementById(
"m2"
).style.display="block";

}

if(stage==3){

document.getElementById(
"m3"
).style.display="block";

document.getElementById(
"continueBtn"
).style.display="inline-block";

}

}

</script>

</body>

</html>
