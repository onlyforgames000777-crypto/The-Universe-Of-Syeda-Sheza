<!DOCTYPE html>
<html>

<head>

<title>🤝 First Handshake 🤝</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(
to bottom,
#020617,
#0f172a,
#1e293b
);
color:white;
text-align:center;
overflow:hidden;
}

.container{
padding-top:50px;
max-width:900px;
margin:auto;
position:relative;
z-index:10;
}

h1{
font-size:60px;
text-shadow:
0 0 15px white,
0 0 30px #60a5fa;
}

.date{
font-size:30px;
color:#93c5fd;
margin-bottom:20px;
}

.handshake{
font-size:140px;
animation:float 4s infinite ease-in-out;
}

@keyframes float{

0%{
transform:translateY(0);
}

50%{
transform:translateY(-15px);
}

100%{
transform:translateY(0);
}

}

.memory{
font-size:26px;
line-height:2;
padding:25px;
max-width:800px;
margin:auto;
}

.secret{
display:none;
font-size:24px;
line-height:1.8;
padding:20px;
max-width:700px;
margin:auto;
background:rgba(255,255,255,0.08);
border-radius:20px;
margin-top:20px;
}

button{
padding:15px 30px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

.star{
position:absolute;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
0%{opacity:0.2;}
50%{opacity:1;}
100%{opacity:0.2;}
}

</style>

</head>

<body>

<div class="container">

<h1>
🤝 First Handshake 🤝
</h1>

<div class="date">
21 March 2026
</div>

<div class="handshake">
🤝
</div>

<div class="memory">

✨🩵🌙

<br><br>

To everyone else...

it was just a handshake.

<br><br>

To me...

it became a memory.

<br><br>

A small moment.

A simple gesture.

Yet somehow...

one I still remember.

<br><br>

🩵✨🌙

</div>

<button onclick="showSecret()">

🥺 One More Thing...

</button>

<div id="secret" class="secret">

💌

<br><br>

You probably don't even realise

how much that small moment

meant to me.

<br><br>

🩵✨🌙

</div>

<br>

<button onclick="location.href='thankyou.html'">

🌷 Continue

</button>

</div>

<script>

for(let i=0;i<180;i++){

let star=document.createElement("div");

star.className="star";

star.innerHTML="⭐";

star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";

document.body.appendChild(star);

}

function showSecret(){

document.getElementById(
"secret"
).style.display="block";

}

</script>

</body>

</html>
