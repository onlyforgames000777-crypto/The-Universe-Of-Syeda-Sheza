<!DOCTYPE html>
<html>

<head>

<title>🫀 I'm Sorry 🫀</title>

<style>

body{
margin:0;
height:100vh;
background:linear-gradient(
to bottom,
#000814,
#001d3d
);
font-family:Arial,sans-serif;
color:white;
text-align:center;
overflow:hidden;
}

.container{
padding-top:80px;
max-width:800px;
margin:auto;
position:relative;
z-index:10;
}

h1{
font-size:60px;
}

.text{
font-size:28px;
line-height:2;
padding:20px;
}

button{
padding:15px 30px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

.star{
position:absolute;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
0%{opacity:0.2;}
50%{opacity:1;}
100%{opacity:0.2;}
}

</style>

</head>

<body>

<div class="container">

<h1>
🫀 I'm Sorry 🫀
</h1>

<div class="text">

For my words... 😔

<br><br>

For my actions... 😔

<br><br>

For my behaviour... 😔

<br><br>

For my restrictions... 😔

<br><br>

And for every time I hurt you... 🩵

</div>

<button onclick="location.href='final.html'">

🌙 Continue

</button>

</div>

<script>

for(let i=0;i<150;i++){

let star=document.createElement("div");

star.className="star";

star.innerHTML="⭐";

star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";

document.body.appendChild(star);

}

</script>

</body>

</html>
