<!DOCTYPE html>
<html>

<head>

<title>✨ Welcome ✨</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial,sans-serif;
background:
linear-gradient(
to bottom,
#020617,
#0f172a,
#1e293b
);
color:white;
text-align:center;
}

.container{

position:absolute;

top:50%;

left:50%;

transform:
translate(-50%,-50%);

width:90%;

z-index:10;

}

h1{

font-size:52px;

margin-bottom:15px;

text-shadow:
0 0 15px white,
0 0 30px #60a5fa;

animation:glow 3s infinite;

}

.subtitle{

font-size:22px;

line-height:1.8;

margin-bottom:30px;

}

button{

padding:16px 35px;

border:none;

border-radius:40px;

font-size:20px;

cursor:pointer;

transition:0.4s;

}

button:hover{

transform:scale(1.08);

}

.star{

position:absolute;

font-size:14px;

animation:twinkle 3s infinite;

}

.float{

position:absolute;

font-size:28px;

animation:rise linear infinite;

pointer-events:none;

}

@keyframes glow{

0%{
text-shadow:
0 0 10px white,
0 0 20px #60a5fa;
}

50%{
text-shadow:
0 0 20px white,
0 0 50px #93c5fd;
}

100%{
text-shadow:
0 0 10px white,
0 0 20px #60a5fa;
}

}

@keyframes twinkle{

0%{opacity:0.2;}
50%{opacity:1;}
100%{opacity:0.2;}

}

@keyframes rise{

from{
transform:translateY(110vh);
}

to{
transform:translateY(-120vh);
}

}

</style>

</head>

<body>

<div class="container">

<h1 id="title"></h1>

<div class="subtitle">

🩵 A small universe filled with memories...

<br><br>

🌙 Built with gratitude, duas and moments that words alone cannot explain.

</div>

<button
onclick="location.href='bismillah.html'">

✨ Enter The Universe ✨

</button>

</div>

<script>

const text=
"Welcome, Syeda Sheza 🌷";

let i=0;

function type(){

if(i<text.length){

document
.getElementById(
"title"
)
.innerHTML+=
text.charAt(i);

i++;

setTimeout(type,80);

}

}

type();

for(let i=0;i<300;i++){

let star=
document.createElement("div");

star.className="star";

star.innerHTML="⭐";

star.style.left=
Math.random()*100+"vw";

star.style.top=
Math.random()*100+"vh";

star.style.animationDuration=
(2+Math.random()*5)+"s";

document.body.appendChild(star);

}

const items=[
"🩵",
"🌙",
"✨",
"🦋",
"🌹",
"💫"
];

for(let i=0;i<100;i++){

let e=
document.createElement("div");

e.className="float";

e.innerHTML=
items[
Math.floor(
Math.random()*items.length
)
];

e.style.left=
Math.random()*100+"vw";

e.style.animationDuration=
(8+Math.random()*12)+"s";

e.style.animationDelay=
Math.random()*10+"s";

document.body.appendChild(e);

}

</script>

</body>

</html>
