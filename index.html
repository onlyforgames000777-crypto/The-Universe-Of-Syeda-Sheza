<!DOCTYPE html>
<html>

<head>

<title>🌌 The Universe Of Syeda Sheza 🌌</title>

<style>

body{
margin:0;
height:100vh;
overflow:hidden;
font-family:Arial,sans-serif;

background:
linear-gradient(
to bottom,
#020617,
#0f172a,
#1e293b
);

display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.container{
z-index:10;
position:relative;
}

h1{
font-size:55px;
text-shadow:
0 0 10px white,
0 0 20px #60a5fa,
0 0 30px #60a5fa;
}

.subtitle{
font-size:22px;
margin-bottom:20px;
}

input{

padding:15px;

border:none;

border-radius:30px;

font-size:20px;

width:250px;

text-align:center;

}

button{

padding:15px 30px;

border:none;

border-radius:30px;

font-size:18px;

margin:10px;

cursor:pointer;

}

.moon{

position:absolute;

top:30px;

right:50px;

font-size:120px;

animation:float 4s infinite ease-in-out;

}

@keyframes float{

0%{
transform:translateY(0);
}

50%{
transform:translateY(-15px);
}

100%{
transform:translateY(0);
}

}

.star{

position:absolute;

color:white;

animation:twinkle 3s infinite;

}

@keyframes twinkle{

0%{
opacity:0.2;
}

50%{
opacity:1;
}

100%{
opacity:0.2;
}

}

.floating{

position:absolute;

font-size:30px;

animation:rise 12s linear infinite;

}

@keyframes rise{

from{
transform:translateY(120vh);
}

to{
transform:translateY(-120vh);
}

}

#hint{

color:#93c5fd;

margin-top:20px;

font-size:20px;

}

</style>

</head>

<body>

<div class="moon">
🌙
</div>

<div class="container">

<h1>
🌌 Syeda Sheza's Universe 🌌
</h1>

<p class="subtitle">

✨🩵🌙💫🦋🌹☁️🎀🪄💌🤲🏻🌷✨

<br><br>

A special universe awaits...

<br>

Only one person can enter...

</p>

<input
type="password"
id="password"
placeholder="🔐 Password">

<br>

<button onclick="checkPassword()">

✨ Unlock Universe ✨

</button>

<br>

<button onclick="showHint()">

🎂 Need A Hint?

</button>

<p id="hint"></p>

</div>

<script>

for(let i=0;i<80;i++){

let star=document.createElement("div");

star.className="star";

star.innerHTML="⭐";

star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";

document.body.appendChild(star);

}

let emojis=[
"🩵",
"🌹",
"🦋",
"💫",
"✨",
"🌙"
];

for(let i=0;i<40;i++){

let e=document.createElement("div");

e.className="floating";

e.innerHTML=
emojis[
Math.floor(
Math.random()*emojis.length
)
];

e.style.left=
Math.random()*100+"vw";

e.style.animationDuration=
(8+Math.random()*10)+"s";

document.body.appendChild(e);

}

function showHint(){

document.getElementById("hint").innerHTML=

"🎂 The day Allah blessed the world with someone special... 🩵✨";

}

function checkPassword(){

let pass=

document.getElementById("password").value;

if(pass=="0604"){

alert(
"✨ Correct 😭🩵✨"
);

window.location.href=
"bismillah.html";

}

else{

alert(
"😭 Wrong password... Try again 🩵"
);

}

}

</script>

</body>

</html>
